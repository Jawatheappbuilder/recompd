name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
      - "public/recompd-android-icon-432.png"
      - "public/recompd-android-icon-512.png"
  push:
    branches: [main]
    paths:
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
      - "public/recompd-android-icon-432.png"
      - "public/recompd-android-icon-512.png"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor Android files
        run: |
          mkdir -p dist
          echo '<!doctype html><html><body></body></html>' > dist/index.html
          npx cap sync android

      - name: Apply RECOMP'D launcher icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p android/app/src/main/res/drawable-nodpi android/app/src/main/res/mipmap-anydpi-v26
          cp public/recompd-android-icon-432.png android/app/src/main/res/drawable-nodpi/recompd_launcher_foreground.png
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/recompd_launcher_background" />
              <foreground android:drawable="@drawable/recompd_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cat > android/app/src/main/res/values/recompd_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="recompd_launcher_background">#FAF1EC</color></resources>
          EOF
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density=$1
            size=$2
            convert public/recompd-android-icon-512.png -resize "${size}x${size}" "android/app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-${density}/ic_launcher.png" "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: recompd-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
